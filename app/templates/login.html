{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="mb-4">Entrar</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" required>
      </div>
      <button type="submit" class="btn w-100" style="background-color:#c2185b;color:white;">Entrar</button>
    </form>
    <p class="mt-3 text-center">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
