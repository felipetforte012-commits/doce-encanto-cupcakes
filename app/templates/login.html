{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="mb-4">Entrar</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" name="email" class="form-control" value="{{ email or '' }}" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" name="senha" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn w-100 btn-doce">Entrar</button>
    </form>
    <p class="mt-3 text-center">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
