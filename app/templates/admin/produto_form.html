{% extends "base.html" %}
{% block title %}{{ 'Editar' if produto else 'Novo' }} produto{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Editar' if produto else 'Novo' }} produto</h1>

<form method="post" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Nome *</label>
    <input type="text" name="nome" class="form-control" value="{{ produto.nome if produto else '' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Sabor</label>
    <input type="text" name="sabor" class="form-control" value="{{ produto.sabor if produto else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Categoria</label>
    <select name="categoria_id" class="form-select">
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if produto and produto.categoria_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Preço (R$) *</label>
    <input type="number" step="0.01" name="preco" class="form-control" value="{{ produto.preco if produto else '' }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Estoque</label>
    <input type="number" name="estoque" class="form-control" value="{{ produto.estoque if produto else 0 }}">
  </div>
  <div class="col-md-8">
    <label class="form-label">URL da foto *</label>
    <input type="text" name="foto_url" class="form-control" value="{{ produto.foto_url if produto else '' }}" required>
  </div>
  <div class="col-md-4 d-flex align-items-end">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not produto or produto.ativo %}checked{% endif %}>
      <label class="form-check-label" for="ativo">Ativo na vitrine</label>
    </div>
  </div>
  <div class="col-12">
    <label class="form-label">Descrição</label>
    <textarea name="descricao" class="form-control" rows="3">{{ produto.descricao if produto else '' }}</textarea>
  </div>
  <div class="col-12">
    <label class="form-label">Alérgenos</label>
    <input type="text" name="alergenos" class="form-control" value="{{ produto.alergenos if produto else '' }}" placeholder="Ex.: glúten, lactose, ovo">
  </div>
  <div class="col-12">
    <button type="submit" class="btn" style="background-color:#c2185b;color:white;">Salvar</button>
    <a href="{{ url_for('admin.listar_produtos') }}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
