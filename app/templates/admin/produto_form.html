{% extends "base.html" %}
{% block title %}{{ 'Editar' if produto else 'Novo' }} produto{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Editar' if produto else 'Novo' }} produto</h1>
<p class="text-muted">Campos com * são obrigatórios.</p>

<form method="post" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-6">
    <label for="nome" class="form-label">Nome *</label>
    <input id="nome" type="text" name="nome" class="form-control" maxlength="120" value="{{ valores.get('nome', '') }}" required>
  </div>
  <div class="col-md-6">
    <label for="sabor" class="form-label">Sabor *</label>
    <input id="sabor" type="text" name="sabor" class="form-control" maxlength="80" value="{{ valores.get('sabor', '') }}" required>
  </div>
  <div class="col-md-4">
    <label for="categoria" class="form-label">Categoria *</label>
    <select id="categoria" name="categoria_id" class="form-select" required>
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if valores.get('categoria_id') == c.id %}selected{% endif %}>{{ c.nome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label for="preco" class="form-label">Preço por unidade (R$) *</label>
    <input id="preco" type="text" inputmode="decimal" name="preco" class="form-control" placeholder="Ex.: 6,50" value="{{ valores.get('preco', '') }}" required>
  </div>
  <div class="col-md-4">
    <label for="estoque" class="form-label">Estoque (unidades)</label>
    <input id="estoque" type="number" min="0" name="estoque" class="form-control" value="{{ valores.get('estoque', '0') }}">
  </div>
  <div class="col-md-8">
    <label for="foto" class="form-label">URL da foto *</label>
    <input id="foto" type="url" name="foto_url" class="form-control" maxlength="255" placeholder="https://..." value="{{ valores.get('foto_url', '') }}" required>
  </div>
  <div class="col-md-4 d-flex align-items-end">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if valores.get('ativo') %}checked{% endif %}>
      <label class="form-check-label" for="ativo">Ativo na vitrine</label>
    </div>
  </div>
  <div class="col-12">
    <label for="descricao" class="form-label">Descrição</label>
    <textarea id="descricao" name="descricao" class="form-control" rows="3">{{ valores.get('descricao', '') }}</textarea>
  </div>
  <div class="col-12">
    <label for="alergenos" class="form-label">Alérgenos</label>
    <input id="alergenos" type="text" name="alergenos" class="form-control" maxlength="255" value="{{ valores.get('alergenos', '') }}" placeholder="Ex.: glúten, lactose, ovo">
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-doce">Salvar</button>
    <a href="{{ url_for('admin.listar_produtos') }}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
