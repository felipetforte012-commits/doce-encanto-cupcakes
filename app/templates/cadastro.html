{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="mb-4">Criar conta</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" value="{{ nome or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha (mín. 8 caracteres)</label>
        <input type="password" name="senha" class="form-control" minlength="8" required>
      </div>
      <button type="submit" class="btn w-100" style="background-color:#c2185b;color:white;">Criar conta</button>
    </form>
    <p class="mt-3 text-center">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
