{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="mb-4">Criar conta</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" type="text" name="nome" class="form-control" value="{{ nome or '' }}" maxlength="120" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" type="email" name="email" class="form-control" value="{{ email or '' }}" maxlength="150" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha (mín. 8 caracteres)</label>
        <input id="senha" type="password" name="senha" class="form-control" minlength="8" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn w-100 btn-doce">Criar conta</button>
    </form>
    <p class="mt-3 text-center">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
